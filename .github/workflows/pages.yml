# https://chess.thesudhanshu.dev: site/index.html (the install commands),
# install.sh and install.ps1, redeployed whenever one changes on main. The
# scripts fetch the latest release, so they need not wait for one.

name: pages

on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, "site/**", .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: sh -n install.sh
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - run: cp install.sh install.ps1 site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
