# https://chess.thesudhanshu.dev: site/index.html (the install command) and
# install.sh, redeployed whenever either changes on main. install.sh always
# fetches the latest release, so it need not wait for one.

name: pages

on:
  push:
    branches: [main]
    paths: [install.sh, "site/**", .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: sh -n install.sh
      - run: cp install.sh site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
