[package]
name = "chess-net"
version = "0.1.0"
edition = "2024"

[dependencies]
chess-core = { path = "../chess-core" }
chess-verify = { path = "../chess-verify" }
ed25519-dalek = "3.0.0"
getrandom = "0.3.4"
if-addrs = "0.15.0"
sha2 = "0.11.1"
snow = { version = "0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
socket2 = { version = "0.6.5", features = ["all"] }
spake2 = "0.4.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
