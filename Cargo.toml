[workspace]
resolver = "2"
members = ["crates/chess-core", "crates/chess-net", "crates/chess-tui", "crates/chess-verify"]

# The piece images are rendered at startup; unoptimised that takes seconds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Release archives (`scripts/package.sh`): smaller and a little faster.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
